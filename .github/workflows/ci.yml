name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        name: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build
            - run: npm run build:showcase

    changelog:
        name: changelog
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Require CHANGELOG.md update when src/ or public/ changed
              run: |
                  files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
                  if echo "$files" | grep -qE '^(src|public)/' && ! echo "$files" | grep -qx 'CHANGELOG.md'; then
                      echo "::error::src/ or public/ changed but CHANGELOG.md did not. Add an entry under [Unreleased] or apply the 'skip-changelog' label."
                      exit 1
                  fi
