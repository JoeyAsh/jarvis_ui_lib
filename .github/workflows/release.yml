name: Release

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: npm
            # Trusted Publishing requires npm >= 11.5.1
            - run: npm install -g npm@latest
            - run: npm ci
            - name: Verify tag matches package version
              run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
            - name: Check if version is already on npm
              id: npm_check
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  if OUT="$(npm view "jarvis-react-ui@${VERSION}" version 2>/dev/null)" && [ -n "$OUT" ]; then
                      echo "published=true" >> "$GITHUB_OUTPUT"
                      echo "::notice::jarvis-react-ui@${VERSION} is already on npm, skipping publish."
                  else
                      echo "published=false" >> "$GITHUB_OUTPUT"
                  fi
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build
            - run: npm run build:showcase
            - name: Publish to npm
              if: steps.npm_check.outputs.published == 'false'
              run: npm publish --provenance --access public
