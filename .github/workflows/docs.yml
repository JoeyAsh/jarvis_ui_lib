name: Docs

# Builds the documentation site (docs/) and deploys it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'src/**'
            - 'public/**'
            - 'scripts/**'
            - 'CHANGELOG.md'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.docs.ts'
            - '.github/workflows/docs.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build:docs
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist-docs

    deploy:
        name: deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
