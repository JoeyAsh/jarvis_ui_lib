version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      ignore:
          # typescript-eslint does not support TypeScript 7 yet; stay on TS 6.
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # Keep @types/node aligned with the Node 22 used in CI.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
