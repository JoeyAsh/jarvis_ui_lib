version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 5
      # Routine (minor/patch) updates arrive bundled; majors stay individual PRs for review.
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: ['minor', 'patch']
          production-dependencies:
              dependency-type: production
              update-types: ['minor', 'patch']
      ignore:
          # typescript-eslint does not support TypeScript 7 yet; stay on TS 6.
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # Keep @types/node aligned with the Node 22 used in CI.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          github-actions:
              patterns: ['*']
              update-types: ['minor', 'patch']
